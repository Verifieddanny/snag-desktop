name: Build Snag Desktop

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            artifact: snag-desktop-macos-arm64
          - os: macos-13
            platform: darwin/amd64
            artifact: snag-desktop-macos-intel
          - os: windows-latest
            platform: windows/amd64
            artifact: snag-desktop-windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: snag-desktop-linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Build
        if: runner.os != 'Linux'
        run: wails build -platform ${{ matrix.platform }}

      - name: Build Linux
        if: runner.os == 'Linux'
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ${{ matrix.artifact }}.zip snag-desktop.app

      - name: Zip Windows app
        if: runner.os == 'Windows'
        run: |
          cd build/bin
          Compress-Archive -Path snag-desktop.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Zip Linux app
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          zip -r ${{ matrix.artifact }}.zip snag-desktop

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/${{ matrix.artifact }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}